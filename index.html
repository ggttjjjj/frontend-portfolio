<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#091410">
  <title>gtj的前端网页作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="intro">
      <img class="mark" src="images/brand-mark.png" alt="" width="16" height="16">
      <h1>gtj的前端网页作品集</h1>
      <p>这是我的前端网页作品，点击卡片可以跳转到对应的页面！</p>
    </header>

    <section class="works" aria-label="前端网页作品">
      <a class="card" href="https://quiz-game-seven-gold.vercel.app/">
        <img class="shot" src="images/quiz.png" alt="Quiz Game 问答练习页面截图">
        <div class="card-info">
          <h2>Quiz Game</h2>
          <span class="tag">Quiz</span>
        </div>
      </a>
      <a class="card" href="https://register-page-gules.vercel.app/">
        <img class="shot" src="images/register.png" alt="Register Form 注册表单页面截图">
        <div class="card-info">
          <h2>Register Form</h2>
          <span class="tag">Register</span>
        </div>
      </a>
      <a class="card" href="https://recipe-finder-three-chi.vercel.app/">
        <img class="shot" src="images/recipe.png" alt="Recipe Finder 菜谱搜索页面截图">
        <div class="card-info">
          <h2>Recipe Finder</h2>
          <span class="tag">Recipe</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
